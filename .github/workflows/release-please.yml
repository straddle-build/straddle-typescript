name: Release Please

on:
  # Fires when a human merges the platform-managed release PR into main
  # (the PR's base, so its diff shows the full pending release). Regenerations and
  # custom-code pushes only touch scalar-next and never run this workflow.
  push:
    branches:
      - main
  # Manual fallback only; nothing in the automated chain depends on dispatch.
  workflow_dispatch:
    inputs:
      recover_npm_1_0_0:
        description: Publish immutable v1.0.0 to npm as latest
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # Required to update the merged release PR's autorelease labels after tagging.
  pull-requests: write

jobs:
  release-please:
    if: ${{ !inputs.recover_npm_1_0_0 }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # Consumed by the publish job's checkout: without this mapping the checkout ref would be
      # empty and the publish would build the triggering branch head instead of the released
      # tag's exact commit.
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Release PRs are opened and updated by the Scalar platform with its own
          # credential (so their CI runs without manual approval); this workflow only
          # cuts the tag + GitHub Release once a release PR is merged.
          skip-github-pull-request: true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          fetch-depth: 0
      # Merging the release PR into main is itself the promotion, but the
      # version bump and changelog must also land back on scalar-next, or the next
      # release PR would propose this release again. A real merge (never a plain
      # commit push) so a squash- or rebase-merged release PR syncs just as well; the
      # non-conventional message keeps the sync commit out of future changelogs. Plain
      # (non-force) push on purpose: losing a race against a concurrent regeneration
      # push fails loudly here, and the platform's next sync re-converges.
      - name: Sync release back to scalar-next
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin scalar-next
          git checkout -B scalar-next origin/scalar-next
          git merge --no-edit -m "Sync release ${{ steps.release.outputs.tag_name }} back to scalar-next" "${{ steps.release.outputs.sha }}"
          git push origin scalar-next
  publish:
    needs: release-please
    # `!cancelled()` keeps publishing even when the back-sync to the integration branch
    # failed: a raced integration branch must not block the release from reaching its
    # registry.
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's release-cutting grants with the publish
    # floor. OIDC trusted publishing verifies this run's claims, which name this workflow
    # file — register release-please.yml as the trusted publisher on the registry.
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      VERSIONING_POLICY: manual
    steps:
      # Publishing runs inline — a top-level job of this same run — rather than dispatching
      # sdk-release.yml: workflow_dispatch resolves the target workflow on the repository's
      # default branch only, so a dispatch would 404 whenever the release line is any other
      # branch, while OIDC trusted publishing accepts this job because it stays top-level
      # (never a reusable-workflow call). The release-please job cut the tag earlier in this
      # run; checking it out publishes exactly the released commit, not the branch head that
      # triggered the workflow.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npm run build
      # OIDC trusted publishing needs npm >= 11.5; pinned to the major (not `latest`) so a new
      # npm major raising its Node engine floor cannot break publishes against the pinned Node.
      - run: npm install -g npm@11
      - name: Publish to npm
        run: node scripts/publish-npm.mjs

  recover-npm-1-0-0:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.recover_npm_1_0_0 &&
        github.actor == 'hello-keith' &&
        github.ref == 'refs/heads/scalar-next'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v1.0.0
          fetch-depth: 0

      - name: Verify immutable release source
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "straddle-build/straddle-typescript"
          test "$(git describe --tags --exact-match)" = "v1.0.0"
          test ! -f .npmrc

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0

      - name: Install verified npm version
        shell: bash
        run: |
          npm install -g npm@11.19.1
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.1"

      - name: Build immutable release
        run: |
          npm install
          npm run build

      - name: Pack and verify immutable package
        id: package
        shell: bash
        run: |
          if npm view @straddlecom/straddle@1.0.0 version >/dev/null 2>&1; then
            echo "::error::npm already contains @straddlecom/straddle@1.0.0"
            exit 1
          fi

          npm pack --json > npm-pack.json
          package_file="$(jq -r '.[0].filename' npm-pack.json)"
          integrity="$(jq -r '.[0].integrity' npm-pack.json)"
          test -n "$package_file"
          test -n "$integrity"

          tar -xOf "./$package_file" package/package.json > packed-package.json
          jq -e '
            .name == "@straddlecom/straddle" and
            .version == "1.0.0" and
            .repository.type == "git" and
            .repository.url == "git+https://github.com/straddle-build/straddle-typescript.git"
          ' packed-package.json

          echo "filename=$package_file" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Publish immutable package as latest
        run: >-
          npm publish "./${{ steps.package.outputs.filename }}"
          --access public
          --tag latest
          --registry https://registry.npmjs.org/

      - name: Verify npm package integrity and provenance
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          for attempt in $(seq 1 12); do
            actual_integrity="$(npm view @straddlecom/straddle@1.0.0 dist.integrity --json 2>/dev/null | tr -d '"')"
            latest="$(npm view @straddlecom/straddle dist-tags.latest --json 2>/dev/null | tr -d '"')"
            provenance="$(npm view @straddlecom/straddle@1.0.0 dist.attestations.provenance.predicateType --json 2>/dev/null | tr -d '"')"

            if [ "$actual_integrity" = "$EXPECTED_INTEGRITY" ] &&
              [ "$latest" = "1.0.0" ] &&
              [ "$provenance" = "https://slsa.dev/provenance/v1" ]; then
              exit 0
            fi

            sleep 5
          done

          echo "::error::Published npm metadata did not match the verified package"
          exit 1
